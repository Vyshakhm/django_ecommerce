{%  extends 'base.html' %}
<!DOCTYPE html>
<html>
<head>
    {% block content %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body {
  font-family: Arial;
  font-size: 17px;
  padding: 8px;
}

* {
  box-sizing: border-box;
}
h4,.price{
    color: #1b1b1b;
    size: 5px;

}
.row {
  display: -ms-flexbox; /* IE10 */
  display: flex;
  -ms-flex-wrap: wrap; /* IE10 */
  flex-wrap: wrap;
  margin: 0 -16px;
}

.col-25 {
  -ms-flex: 25%; /* IE10 */
  flex: 25%;
}

.col-50 {
  -ms-flex: 50%; /* IE10 */
  flex: 50%;
}

.col-75 {
  -ms-flex: 75%; /* IE10 */
  flex: 75%;
}

.col-25,
.col-50,
.col-75 {
  padding: 0 16px;
}

.container {
  background-color: #f2f2f2;
  padding: 5px 20px 15px 20px;
  border: 1px solid lightgrey;
  border-radius: 3px;
}

input[type=text] {
  width: 100%;
  margin-bottom: 20px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 3px;
}

label {
  margin-bottom: 10px;
  display: block;
}

.icon-container {
  margin-bottom: 20px;
  padding: 7px 0;
  font-size: 24px;
}

.btn {
  background-color: #04AA6D;
  color: white;
  padding: 12px;
  margin: 10px 0;
  border: none;
  width: 100%;
  border-radius: 3px;
  cursor: pointer;
  font-size: 17px;
}

.btn:hover {
  background-color: #45a049;
}

a {
  color: #2196F3;
}

hr {
  border: 1px solid lightgrey;
}

span.price {
  float: right;
  color: grey;
}

/* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other (also change the direction - make the "cart" column go on top) */
@media (max-width: 800px) {
  .row {
    flex-direction: column-reverse;
  }
  .col-25 {
    margin-bottom: 20px;
  }
}
.tm-btn {
  display: inline-block;
  padding: 15px 40px;
  font-size: 1.1rem;
  border: none;
  background-color: #CC9999;
  color: white;
}
.tm-btn:hover {
  color: white;
  background-color: #875959;
}
</style>

</head>
<body>

<div class="row" style="margin: 15px;">
  <div class="col-75">
    <div class="container">
      <form action="/action_page.php" class="form-control" >
          <div class="col-25">

            <div class="container" style="margin: 10px;">
              <h4>Cart <span class="price" style="color:black"><i class="fa fa-shopping-cart"></i> <b>{{ itc }}</b></span></h4>
                {% for i in ci %}
               <span  style="color:black; padding:10px;" ><a href={% url 'delete' i.prod.id %}><i class="fa fa-trash"></i></a></span><a href="{{  i.prod.get_absolute_url  }}"><img src="{{ i.prod.image.url }}" alt="{{ i.prod.name }}" style="width: 80px; height: 80px;"></a>
                    <p><a href="{{  i.prod.get_absolute_url  }}">{{ i.prod.name }}</a> <span class="price">${{ i.total }}<br><a href={% url 'add' i.prod.id %}><i class="fa fa-plus-square"></i></a>&nbsp;{{ i.quantity }} &nbsp;<a href={% url 'min' i.prod.id %}><i class="fa fa-minus-square"></i></a></span></p>
                    <p>Price:${{ i.prod.price }} x {{ i.quantity }}</p>
                {% endfor %}
              <hr>
              <p class="price">Grand Total : <span class="price" style="color:black"><b>${{ tot }}</b></span></p>
                <span  style=" width:100%; display:inline-block;text-align:right;font-size:16px;"> <a href="{% url 'checkout' %} " class= "tm-btn tm-btn-1" >CheckOut</a></span>
            </div>
          </div>
      </form>
  </div>
</div>
{% endblock %}
